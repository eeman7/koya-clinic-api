<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an appointment</title>
<style>
  :root { --bg:#f6f8fa; --card:#fff; --text:#1b2733; --muted:#5f6c7b; --line:#dde3ea; --brand:#0b7a75; --brand-d:#085c58; --err:#b3261e; --ok:#1a7f37; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12171c; --card:#1b232b; --text:#e8edf2; --muted:#9aa7b5; --line:#2e3944; --brand:#3cb8b0; --brand-d:#2f968f; --err:#ff8a80; --ok:#56d364; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:720px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 4px; } h2 { font-size:1.1rem; margin:0 0 12px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  select, input { font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); width:100%; }
  .toolbar select { width:auto; min-width:180px; }
  ul { list-style:none; padding:0; margin:0; }
  li.slot { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  li.slot:first-child { border-top:0; }
  .meta { color:var(--muted); font-size:.9rem; }
  button { font:inherit; border:0; border-radius:8px; padding:9px 16px; cursor:pointer; background:var(--brand); color:#fff; }
  button:hover { background:var(--brand-d); } button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--brand); border:1px solid var(--brand); }
  .tag { font-size:.8rem; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:2px 10px; }
  label { display:block; font-size:.9rem; margin:10px 0 4px; }
  .msg { margin-top:12px; font-size:.95rem; } .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
  dl { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; margin:0 0 12px; } dt { color:var(--muted); } dd { margin:0; word-break:break-all; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Book an appointment</h1>
  <p class="sub">Pick an available time, tell us who you are, and you're booked.</p>

  <section class="card" id="slots-card">
    <h2>Available slots</h2>
    <div class="toolbar">
      <select id="provider" aria-label="Filter by provider"><option value="">All providers</option></select>
      <button class="ghost" id="refresh" type="button">Refresh</button>
    </div>
    <ul id="slots"></ul>
    <div class="msg" id="slots-msg" role="status"></div>
  </section>

  <section class="card" id="form-card" hidden>
    <h2>Your details</h2>
    <div class="meta" id="chosen"></div>
    <form id="form" novalidate>
      <label for="name">Full name</label>
      <input id="name" autocomplete="name" required>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button type="submit" id="submit">Confirm booking</button>
        <button type="button" class="ghost" id="cancel-form">Back</button>
      </div>
    </form>
    <div class="msg" id="form-msg" role="alert"></div>
  </section>

  <section class="card" id="confirm-card" hidden>
    <h2>Booking confirmed ✓</h2>
    <dl id="confirm"></dl>
    <button class="ghost" id="cancel-booking" type="button">Cancel this booking</button>
    <button id="another" type="button">Book another</button>
    <div class="msg" id="confirm-msg" role="status"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let chosen = null, booking = null, idemKey = null;

async function api(path, opts = {}) {
  const res = await fetch("/site" + path, { ...opts, headers: { "Content-Type": "application/json", ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const retry = res.headers.get("Retry-After");
    const e = new Error(data.error || "Something went wrong");
    e.status = res.status; e.retry = retry; throw e;
  }
  return data;
}
const fmt = (iso) => new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
const show = (id, on) => { $(id).hidden = !on; };
const say = (id, text, cls = "") => { $(id).textContent = text; $(id).className = "msg " + cls; };

async function loadSlots() {
  say("slots-msg", "Loading…");
  try {
    const { slots } = await api("/slots" + ($("provider").value ? "?provider=" + encodeURIComponent($("provider").value) : ""));
    const known = new Set([...$("provider").options].map((o) => o.value));
    for (const s of slots) if (!known.has(s.provider)) { known.add(s.provider); $("provider").add(new Option(s.provider, s.provider)); }
    const list = $("slots"); list.replaceChildren();
    for (const s of slots) {
      const li = document.createElement("li"); li.className = "slot";
      const info = document.createElement("div");
      info.innerHTML = `<strong></strong><div class="meta"></div>`;
      info.firstChild.textContent = fmt(s.start) + " – " + new Date(s.end).toLocaleTimeString([], { timeStyle: "short" });
      info.lastChild.textContent = s.provider;
      li.append(info);
      if (s.available && new Date(s.start) > new Date()) {
        const b = document.createElement("button"); b.textContent = "Book"; b.onclick = () => choose(s); li.append(b);
      } else {
        const t = document.createElement("span"); t.className = "tag"; t.textContent = s.available ? "Past" : "Booked"; li.append(t);
      }
      list.append(li);
    }
    say("slots-msg", slots.length ? "" : "No slots found.");
  } catch (e) { say("slots-msg", e.message, "err"); }
}

function choose(s) {
  chosen = s; idemKey = crypto.randomUUID();
  $("chosen").textContent = `${s.provider} · ${fmt(s.start)}`;
  say("form-msg", ""); show("form-card", true); show("slots-card", false); $("name").focus();
}

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const name = $("name").value.trim(), email = $("email").value.trim();
  if (!name || !/^[^\s@]+@[^\s@.]+(\.[^\s@.]+)+$/.test(email)) return say("form-msg", "Please enter your name and a valid email.", "err");
  $("submit").disabled = true; say("form-msg", "Booking…");
  try {
    // The idempotency key makes an accidental double-click or retry safe.
    booking = await api("/bookings", { method: "POST", headers: { "Idempotency-Key": idemKey }, body: JSON.stringify({ slot_id: chosen.id, name, email }) });
    showConfirmation();
  } catch (e) {
    if (e.status === 409) { say("form-msg", "Sorry, that slot was just taken. Please pick another.", "err"); await loadSlots(); }
    else if (e.status === 429) say("form-msg", `Too many attempts. Try again in ${e.retry || 60} seconds.`, "err");
    else say("form-msg", e.message, "err");
  } finally { $("submit").disabled = false; }
});

function showConfirmation() {
  const dl = $("confirm"); dl.replaceChildren();
  const rows = [["Booking ID", booking.id], ["Provider", chosen.provider], ["Time", fmt(chosen.start)], ["Name", booking.name], ["Email", booking.email], ["Status", booking.status]];
  for (const [k, v] of rows) { const dt = document.createElement("dt"), dd = document.createElement("dd"); dt.textContent = k; dd.textContent = v; dl.append(dt, dd); }
  $("cancel-booking").hidden = booking.status !== "confirmed";
  say("confirm-msg", ""); show("form-card", false); show("confirm-card", true);
}

$("cancel-booking").onclick = async () => {
  try { booking = await api("/bookings/" + booking.id, { method: "DELETE" }); showConfirmation(); say("confirm-msg", "Your booking has been cancelled.", "ok"); }
  catch (e) { say("confirm-msg", e.message, "err"); }
};
$("cancel-form").onclick = () => { show("form-card", false); show("slots-card", true); };
$("another").onclick = () => { $("form").reset(); show("confirm-card", false); show("slots-card", true); loadSlots(); };
$("refresh").onclick = loadSlots;
$("provider").onchange = loadSlots;
loadSlots();
</script>
</body>
</html>
